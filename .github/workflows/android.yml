name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Sign with a fixed debug key so each build installs over the previous one.
      - name: Restore debug keystore
        if: env.DEBUG_KEYSTORE_BASE64 != ''
        run: |
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore

      - name: Build and test
        run: ./gradlew assembleDebug testDebugUnitTest --console=plain
        env:
          VERSION_CODE: ${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: hn2-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # A rolling pre-release, so the download link never changes.
      - name: Publish "latest" pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk hn2-debug.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest hn2-debug.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "hn2 latest (debug, build ${{ github.run_number }})" \
            --notes "Built from ${GITHUB_SHA::7}. Download the APK on your phone to install or update."
