name: Android

on:
  push:
    branches: [main]
    # Docs-only pushes don't change the APK, so they don't build or release.
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Sign with a fixed debug key so each build installs over the previous one.
      - name: Restore debug keystore
        if: env.DEBUG_KEYSTORE_BASE64 != ''
        run: |
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
          echo "HN2_DEBUG_KEYSTORE=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"

      # Releases count up from the newest vX.Y.Z tag: v0.1.0, v0.1.1, ... A versionName in
      # app/build.gradle.kts above that (say 0.2.0) is released as is. Either way the new
      # version is written into app/build.gradle.kts before building.
      - name: Pick next version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          last=$(git ls-remote --tags --refs origin 'v*' | sed 's#.*refs/tags/v##' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ -z "$last" ]; then next=0.1.0; else next="${last%.*}.$(( ${last##*.} + 1 ))"; fi
          current=$(sed -n -E 's/.*versionName = "([^"]*)".*/\1/p' app/build.gradle.kts)
          if [ "$current" != "${last:-}" ] && [ "$(printf '%s\n' "$current" "$next" | sort -V | tail -1)" = "$current" ]; then next=$current; fi
          echo "Releasing $next (previous: ${last:-none})"
          echo "VERSION=$next" >> "$GITHUB_ENV"
          sed -i -E "s/versionName = \"[^\"]*\"/versionName = \"$next\"/" app/build.gradle.kts
          grep -q "versionName = \"$next\"" app/build.gradle.kts

      # Each build ships the current EasyList. If easylist.to is down, the committed copy is used.
      - name: Refresh ad hosts
        run: ./scripts/update-adhosts.sh || echo "::warning::EasyList fetch failed; using the committed ad host list"

      - name: Build and test
        run: ./gradlew assembleDebug testDebugUnitTest --console=plain
        env:
          VERSION_CODE: ${{ github.run_number }}

      # Phones only accept an update signed with the same key as the installed app.
      - name: Check APK signing key
        if: env.DEBUG_KEYSTORE_BASE64 != ''
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          actual=$("$apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          echo "APK signed with $actual"
          test "$actual" = "a13e6d2c06e99d1e9c0a33f506e7fe27ecbeb0024029020965287b041f1e22e9"

      - uses: actions/upload-artifact@v4
        with:
          name: hn2-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk hn2-debug.apk
          gh release create "v$VERSION" hn2-debug.apk \
            --latest \
            --target "$GITHUB_SHA" \
            --title "hn2 $VERSION" \
            --notes "Built from ${GITHUB_SHA::7}. Download **hn2-debug.apk** below on your Android phone and open it to install, or to update an existing install."

      # Keep the version in the repo in step with the newest release. If main has
      # moved on meanwhile, the next release writes its own version instead.
      - name: Commit version bump
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Release $VERSION [skip ci]" app/build.gradle.kts
          git push origin HEAD:main || echo "main moved on; skipping the version commit"
