name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Sign with a fixed debug key so each build installs over the previous one.
      - name: Restore debug keystore
        if: env.DEBUG_KEYSTORE_BASE64 != ''
        run: |
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
          echo "HN2_DEBUG_KEYSTORE=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"

      - name: Build and test
        run: ./gradlew assembleDebug testDebugUnitTest --console=plain
        env:
          VERSION_CODE: ${{ github.run_number }}

      # Phones only accept an update signed with the same key as the installed app.
      - name: Check APK signing key
        if: env.DEBUG_KEYSTORE_BASE64 != ''
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          actual=$("$apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          echo "APK signed with $actual"
          test "$actual" = "a13e6d2c06e99d1e9c0a33f506e7fe27ecbeb0024029020965287b041f1e22e9"

      - uses: actions/upload-artifact@v4
        with:
          name: hn2-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # One rolling release, marked as the repo's latest so /releases/latest always finds it.
      - name: Publish "latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk hn2-debug.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest hn2-debug.apk \
            --latest \
            --target "$GITHUB_SHA" \
            --title "hn2 build ${{ github.run_number }}" \
            --notes "Built from ${GITHUB_SHA::7}. Download **hn2-debug.apk** below on your Android phone and open it to install, or to update an existing install."
